apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      # Increase HTTP server timeouts so metric queries over 1h ranges do not time out
      http_server_read_timeout: 120s
      http_server_write_timeout: 120s
      http_server_idle_timeout: 120s
    common:
      path_prefix: /loki-data
      storage:
        filesystem:
          chunks_directory: /loki-data/chunks
          rules_directory: /loki-data/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    compactor:
      working_directory: /loki-data/compactor
      shared_store: filesystem
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    ruler:
      alertmanager_url: http://localhost:9093
    # ------------------------------------------------------------------
    # limits_config — per-tenant overrides.
    #
    # Root cause of HTTP 500 "too many outstanding requests":
    #   The query_scheduler default max_outstanding_requests_per_tenant
    #   is only 100.  With 5 dashboard panels × ~4 sub-queries each
    #   (after setting split_queries_by_interval: 15m) plus 3 variable
    #   refresh queries firing simultaneously on dashboard load, the
    #   queue fills and Loki returns HTTP 500.
    #
    # All field names verified against Loki 2.9.x official documentation.
    # ------------------------------------------------------------------
    limits_config:
      retention_period: 168h
      # How long to wait for a single query to complete.
      # Default is 1m which is too short for rate() over a 1h range.
      query_timeout: 120s

      # Split each time-range query into 15-minute sub-intervals.
      # Default is 30m; reducing to 15m means each sub-query is smaller
      # but we produce max 4 sub-queries per 1h range (was up to 60 with
      # the old hardcoded [1m] step).  Combined with $__interval in the
      # dashboard, this is now safe.
      split_queries_by_interval: 15m

      # Maximum parallel shards per query.
      # Default is 32 — keep it, but it is stated here explicitly so
      # the intent is clear.  On a single-binary Loki with 500m CPU,
      # 32 is adequate.
      max_query_parallelism: 32

      # Maximum log entries returned per log panel query.
      # Default is already 5000 — stated explicitly here for clarity.
      # This caps the Recent Error Logs and Service Log Stream panels.
      max_entries_limit_per_query: 5000

    # ------------------------------------------------------------------
    # query_scheduler — controls the per-tenant request queue.
    #
    # max_outstanding_requests_per_tenant lives HERE in Loki 2.9.x,
    # NOT under limits_config.
    #
    # Default is 100.  With 5 panels + 3 variable queries firing on
    # dashboard load = 8 simultaneous requests, each split into up to
    # 4 sub-queries = 32 sub-requests.  Raising to 256 gives comfortable
    # headroom without uncapped growth.
    # ------------------------------------------------------------------
    query_scheduler:
      max_outstanding_requests_per_tenant: 256

    # ------------------------------------------------------------------
    # query_range — frontend query splitting and caching behaviour.
    # ------------------------------------------------------------------
    query_range:
      align_queries_with_step: true
      cache_results: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:2.9.2
        args:
        - -config.file=/etc/loki/loki.yaml
        ports:
        - containerPort: 3100
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: storage
          mountPath: /loki-data
        resources:
          requests:
            cpu: "100m"
            # Raised from 128Mi — Loki had 4 restarts, indicating memory
            # pressure during query bursts.
            memory: "256Mi"
          limits:
            cpu: "500m"
            # Raised from 512Mi to 768Mi.  Current idle usage is 177Mi;
            # concurrent query bursts push this higher.
            memory: "768Mi"
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: storage
        persistentVolumeClaim:
          claimName: loki-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  ports:
  - port: 3100
    targetPort: 3100
  selector:
    app: loki
