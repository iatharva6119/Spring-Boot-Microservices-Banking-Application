spring:
  application:
    name: transaction-service
    bad_request: 400
    conflict: 409
    ok: 200

  datasource:
    url: jdbc:mysql://localhost:3306/transaction_service
    username: root
    password: Netcracker@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/

server:
  port: 8084

# ============================================================
# Performance Engineering Monitoring — Actuator + Prometheus
# Spring Boot 2.7.x syntax (management.metrics.export.prometheus)
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    export:
      prometheus:
        enabled: true

    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http.server.requests: true

      percentiles:
        http.server.requests: 0.50,0.95,0.99

      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s