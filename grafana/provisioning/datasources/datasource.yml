# ==========================================================
# Grafana Datasource Provisioning
# Banking Application — Performance Engineering Monitoring
# ==========================================================
# Uses http://prometheus:9090 (Docker service name)
# NOT http://localhost:9090 (which would fail inside Docker)
# ==========================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    version: 1
    editable: false
    jsonData:
      timeInterval: "5s"
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    uid: Loki
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: false

  - name: Jaeger
    type: jaeger
    access: proxy
    orgId: 1
    url: http://jaeger-query:16686
    basicAuth: false
    isDefault: false
    version: 1
    editable: false
